name: SystemMonitorAgent

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish single-file self-contained EXE
        run: |
          dotnet publish \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorldWindowsService
          path: publish/HelloWorldWindowsService.exe