name: SystemMonitorAgent

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore ./SystemMonitorAgent.slnx -r win-x64

      - name: Build solution
        run: dotnet build ./SystemMonitorAgent.slnx --no-restore -c Release

      - name: Publish single-file self-contained EXE
        run: |
          dotnet publish \
            ./SystemMonitorAgent/SystemMonitorAgent.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:EnableCompressionInSingleFile=true \
            -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: HelloWorldWindowsService
          path: publish/HelloWorldWindowsService.exe